<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Presupuesto</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
  }

  h2 {
    margin-top: 30px;
  }

  .container {
    background: white;
    padding: 15px;
    border-radius: 8px;
    max-width: 900px;
    margin: auto;
    box-shadow: 0 2px 10px #0001;
  }

  input, textarea, select {
    width: 100%;
    padding: 8px;
    margin: 5px 0 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  button {
    background: #007bff;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }

  table th, table td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
  }

  table th {
    background: #f0f0f0;
  }

  .totales {
    margin-top: 20px;
    text-align: right;
  }

  .totales div {
    margin: 4px 0;
    font-size: 18px;
  }
</style>

</head>
<body>

<div class="container">
  <h2>Datos del Cliente</h2>

  <label>Nombre</label>
  <input type="text" id="clienteNombre">

  <label>RUT</label>
  <input type="text" id="clienteRUT">

  <h2>Ítems</h2>

  <button onclick="agregarItem()">Agregar Ítem</button>

  <table id="tablaItems">
    <thead>
      <tr>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="totales">
    <div>Sub-Total Neto: <strong id="neto">0</strong></div>
    <div>IVA (19%): <strong id="iva">0</strong></div>
    <div>Total Final: <strong id="total">0</strong></div>
  </div>

  <h2>Condiciones</h2>
  <textarea id="condiciones" rows="5"></textarea>

  <br><br>
  <button onclick="guardarCotizacion()">Guardar Cotización</button>
</div>

<script>
/* ================================
      CONFIG
================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbywhh9_YO8hv-t56MG0tAUEqoww3-DFYSk6YELZGUHvRzwWJu1DT5zhc7wivweEgB9vvg/exec";

let productos = [];

/* ================================
      CARGAR PRODUCTOS
================================ */
async function cargarProductos() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    if (data.estado === "exito") {
      productos = data.productos;
    }
  } catch (e) {
    console.error("Error cargando productos", e);
  }
}
cargarProductos();

/* ================================
      AGREGAR ITEM
================================ */
function agregarItem() {
  const tbody = document.querySelector("#tablaItems tbody");

  const fila = document.createElement("tr");

  fila.innerHTML = `
    <td>
      <select class="descripcion" onchange="actualizarPrecio(this)">
        <option value="">Seleccionar…</option>
        ${productos.map(p => `<option value="${p.descripcion}" data-precio="${p.precio}">${p.descripcion}</option>`)}
      </select>
    </td>

    <td><input type="number" class="precio" readonly></td>

    <td><input type="number" class="cantidad" value="1" min="1" oninput="actualizarTotales()"></td>

    <td><input type="number" class="total" readonly></td>

    <td><button onclick="this.parentNode.parentNode.remove(); actualizarTotales()">X</button></td>
  `;

  tbody.appendChild(fila);
}

/* ================================
      ACTUALIZAR PRECIO AL SELECCIONAR
================================ */
function actualizarPrecio(select) {
  const precio = select.options[select.selectedIndex].dataset.precio || 0;

  const fila = select.parentElement.parentElement;
  fila.querySelector(".precio").value = precio;

  actualizarTotales();
}

/* ================================
      CALCULAR TOTALES
================================ */
function actualizarTotales() {
  let neto = 0;

  document.querySelectorAll("#tablaItems tbody tr").forEach(fila => {
    const precio = Number(fila.querySelector(".precio").value) || 0;
    const cantidad = Number(fila.querySelector(".cantidad").value) || 0;

    const total = precio * cantidad;
    fila.querySelector(".total").value = total;

    neto += total;
  });

  const iva = Math.round(neto * 0.19);
  const total = neto + iva;

  document.getElementById("neto").textContent = neto;
  document.getElementById("iva").textContent = iva;
  document.getElementById("total").textContent = total;
}

/* ================================
      GUARDAR COTIZACIÓN
================================ */
async function guardarCotizacion() {
  const items = [];

  document.querySelectorAll("#tablaItems tbody tr").forEach(fila => {
    items.push({
      descripcion: fila.querySelector(".descripcion").value,
      precio: Number(fila.querySelector(".precio").value),
      cantidad: Number(fila.querySelector(".cantidad").value),
      total: Number(fila.querySelector(".total").value)
    });
  });

  const data = {
    cliente: {
      nombre: document.getElementById("clienteNombre").value,
      rut: document.getElementById("clienteRUT").value
    },
    items,
    condiciones: document.getElementById("condiciones").value,
    neto: Number(document.getElementById("neto").textContent),
    iva: Number(document.getElementById("iva").textContent),
    total: Number(document.getElementById("total").textContent)
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });

    const respuesta = await res.json();
    alert("Cotización guardada. Número asignado: " + respuesta.numeroAsignado);

  } catch (e) {
    console.error("Error al guardar", e);
    alert("Error al guardar la cotización.");
  }
}
</script>

</body>
</html>
