<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Presupuesto - Realtech SpA</title>

<link rel="manifest" href="./manifest.json">

<style>
  /* --- ESTILOS BASE (Común a Escritorio y Móvil) --- */
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0; 
    margin: 0;
    padding: 20px 0;
    display: flex;
    justify-content: center;
  }

  /* Hoja de Papel (FLUIDA en pantalla, RÍGIDA al imprimir) */
  .documento {
    background-color: white;
    width: 95%; /* 95% del ancho en móvil */
    max-width: 21.59cm; /* Límite para escritorio */
    min-height: 100vh; /* Para que se vea completo en móvil */
    padding: 15px; /* Menos padding en móvil */
    box-sizing: border-box;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; 
    overflow: visible; /* Permitir el scroll en pantalla */
  }

  /* Header */
  .header {
    border-bottom: 2px solid #004a99;
    padding-bottom: 10px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap; /* Permitir que los bloques se apilen en móvil */
  }

  .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-grow: 1; }
  .logo img { width: 90px; display: block; } 
  
  .empresa-info { font-size: 11px; color: #000; line-height: 1.3; }
  .empresa-nombre { font-size: 16px; font-weight: bold; color: #004a99; display: block; }
  .titulo-doc { text-align: right; }
  .titulo-doc h1 { font-size: 20px; margin: 0; color: #004a99; }
  .fecha-box { font-size: 11px; margin-top: 5px; font-weight: bold; color: #333; }
  .fecha-box input {
    border: none; background: transparent; font-size: 11px; font-weight: bold; 
    color: #333; padding: 0; width: 100px; outline: none;
  }

  /* Títulos de Sección */
  h2 {
    font-size: 10px; background: #f0f0f0; padding: 4px 8px;
    border-left: 3px solid #004a99; text-transform: uppercase;
    color: #222; margin-bottom: 8px; margin-top: 0;
  }

  /* Grid Cliente (Adaptable) */
  .grid-cliente {
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
    gap: 8px 15px; 
    margin-bottom: 15px;
  }
  .full-width { grid-column: 1 / -1; } 

  label {
    display: block; font-size: 8px; font-weight: bold;
    color: #004a99; margin-bottom: 1px; text-transform: uppercase;
  }
  input, textarea, select {
    width: 100%; border: none; border-bottom: 1px solid #ccc;
    padding: 3px 0; font-size: 12px; outline: none; background: transparent;
  }

  /* Tabla Wrapper (Importante para scroll horizontal en móvil) */
  .tabla-wrapper {
    overflow-x: auto; 
    margin-bottom: 15px; width: 100%;
  }
  table { 
    width: 100%; 
    min-width: 500px; 
    border-collapse: collapse; 
  }
  th {
    background: #004a99; color: white; font-size: 10px;
    padding: 5px; text-align: left; text-transform: uppercase;
  }
  td { border-bottom: 1px solid #ddd; padding: 4px 5px; font-size: 11px; }
  td input { background: #f5f5f5; padding: 2px; border-radius: 2px; border: none; font-size: 11px; }

  /* Footer */
  .footer-section { flex-shrink: 0; }

  .totales { width: 100%; max-width: 240px; margin-left: auto; margin-bottom: 10px; }
  .fila-total {
    display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px;
  }
  .total-final {
    font-weight: bold; font-size: 15px; color: #004a99;
    border-top: 2px solid #333; margin-top: 4px; padding-top: 4px;
  }

  /* Condiciones Grid (Adaptable) */
  .grid-condiciones {
    display: grid; 
    grid-template-columns: 1fr 1fr; /* 2 Columnas en móvil */
    gap: 10px; 
    margin-bottom: 10px; background: #fafafa; 
    padding: 8px; border-radius: 4px; border: 1px dashed #ccc;
  }
  .cond-item select { font-weight: bold; font-size: 11px; color: #333; cursor: pointer; }
  
  .obs-section textarea { min-height: 30px; font-size: 11px; resize: none; overflow: hidden; }

  /* UI Botones */
  .botonera { position: fixed; bottom: 15px; right: 15px; display: flex; gap: 8px; z-index: 100; }
  button { 
    padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; 
    font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
    font-size: 12px;
  }
  .btn-azul { background: #004a99; color: white; }
  .btn-gris { background: white; color: #333; }
  
  /* ESTILO PARA EL BOTÓN DE GUARDAR */
  .btn-guardar { 
      background: #38a169; /* Verde */ 
      color: white; 
      padding: 8px 12px; 
      cursor: pointer; 
      border: none; 
      border-radius: 4px; 
      font-weight: bold; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
      font-size: 12px;
  }
  /* ----------------------------------------------- */

  .btn-borrar { 
    background: #cc0000; color: white; width: 20px; height: 20px; 
    padding: 0; border-radius: 3px; font-size: 10px; 
  }

  /* --- MEDIAS QUERIES PARA ESCRITORIO --- */
  @media (min-width: 769px) {
    .documento {
      padding: 1cm 1.5cm; 
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .grid-cliente {
      grid-template-columns: 1fr 1fr 1fr; 
    }
    .grid-condiciones {
      grid-template-columns: repeat(4, 1fr); 
    }
    .logo img { width: 110px; }
    .logo-area { margin-bottom: 0; }
    .empresa-info { font-size: 12px; }
  }

  /* =======================================================
     ESTILOS DE IMPRESIÓN (La Vista de "Una Plana" Fija)
     ======================================================= */
  @media print {
    @page { margin: 0mm !important; size: letter; }
    body { margin: 0; padding: 0; background: white; }
    
    .documento {
      width: 100%; 
      height: 27.94cm; 
      max-width: 100%; 
      box-shadow: none;
      padding: 1cm 1.5cm !important; 
      margin: 0;
      overflow: hidden; 
    }

    .botonera, .btn-borrar, .btn-guardar { display: none !important; } 
    
    input, textarea, td input, select, .fecha-box input {
      background: transparent !important; border: none !important; padding: 0 !important;
      resize: none; appearance: none; -webkit-appearance: none;
    }
    .tabla-wrapper { overflow-x: hidden; } 
    table { min-width: auto; }
    input::placeholder { color: transparent; }
    .grid-condiciones { border: none; padding: 0; background: transparent; }
    h2, th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    
    .logo-area { align-items: flex-start; }
    .titulo-doc h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="botonera">
  <button class="btn-gris" onclick="agregarFila()">+ Ítem</button>
  <button class="btn-guardar" onclick="guardarCotizacion()">Guardar y N°</button>
  <button class="btn-azul" onclick="window.print()">Imprimir PDF</button>
</div>

<div class="documento" id="hoja">
  
  <div class="header">
    <div class="logo-area">
      <div class="logo">
        <img src="logo_realtech.png" alt="Logo">
      </div>
      <div class="empresa-info">
        <span class="empresa-nombre">Realtech SpA</span>
        <strong>RUT: 77.651.114-5</strong><br>
        Arturo Prat 780 of 203A, Temuco<br>
        realtech.spa@gmail.com | +56 9 3957 3029
      </div>
    </div>
    <div class="titulo-doc">
      <h1>Presupuesto</h1>
      <div class="fecha-box">
        Emisión: <input type="date" id="fechaInput">
      </div>
    </div>
  </div>

  <h2>Información del Cliente</h2>
  <div class="grid-cliente">
    <div class="campo full-width">
      <label>Cliente / Empresa</label>
      <input type="text" placeholder="Nombre del cliente...">
    </div>
    <div class="campo">
      <label>RUT (Opcional)</label>
      <input type="text" placeholder="XX.XXX.XXX-X">
    </div>
    <div class="campo">
      <label>Contacto</label>
      <input type="text" placeholder="Atención a...">
    </div>
    <div class="campo">
      <label>Email</label>
      <input type="text" placeholder="correo@ejemplo.com">
    </div>
    <div class="campo">
      <label>Teléfono</label>
      <input type="text" placeholder="+56 9...">
    </div>
  </div>

  <div class="tabla-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width:55%">Descripción</th>
          <th style="width:10%" class="text-right">Cant.</th>
          <th style="width:15%" class="text-right">P. Unit.</th>
          <th style="width:20%" class="text-right">Total</th>
          <th style="width:20px"></th>
        </tr>
      </thead>
      <tbody id="tablaCuerpo">
        <tr class="fila">
          <td><input class="desc" list="product-list" type="text" placeholder="Descripción del ítem" onchange="autofillPrice(this)"></td>
          <td><input class="cant text-right" type="number" value="1" oninput="calcular()"></td>
          <td><input class="precio text-right" type="number" value="0" oninput="calcular()"></td>
          <td class="text-right"><span class="subtotal">$0</span></td>
          <td><button class="btn-borrar" onclick="borrar(this)">x</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="footer-section">
    <div class="totales">
      <div class="fila-total">
        <span>Neto:</span>
        <span id="txtNeto">$0</span>
      </div>
      <div class="fila-total">
        <span>IVA (19%):</span>
        <span id="txtIva">$0</span>
      </div>
      <div class="fila-total total-final">
        <span>TOTAL:</span>
        <span id="txtTotal">$0</span>
      </div>
    </div>

    <h2>Condiciones Comerciales</h2>
    <div class="grid-condiciones">
      <div class="cond-item">
        <label>Validez Oferta</label>
        <select>
          <option value="15 días">15 días</option>
          <option value="5 días">5 días</option>
          <option value="10 días">10 días</option>
          <option value="30 días">30 días</option>
        </select>
      </div>

      <div class="cond-item">
        <label>Entrega</label>
        <select>
          <option value="Inmediata">Inmediata</option>
          <option value="2-3 días hábiles">2-3 días hábiles</option>
          <option value="5 días hábiles">5 días hábiles</option>
          <option value="7-10 días hábiles">7-10 días hábiles</option>
          <option value="A convenir">A convenir</option>
        </select>
      </div>
      
      <div class="cond-item">
        <label>Forma de Pago</label>
        <select>
          <option value="Contado / Transf.">Contado / Transf.</option>
          <option value="Crédito 30 Días">Crédito 30 Días</option>
          <option value="50% Pie / 50% Final">50% Pie / 50% Final</option>
          <option value="Orden de Compra">Orden de Compra</option>
        </select>
      </div>
      
      <div class="cond-item">
        <label>Garantía</label>
        <select>
          <option value="12 Meses (1 Año)">12 Meses (1 Año)</option>
          <option value="6 Meses">6 Meses</option>
          <option value="3 Meses">3 Meses</option>
          <option value="24 Meses (2 Años)">24 Meses (2 Años)</option>
          <option value="A convenir">A convenir</option>
        </select>
      </div>

    </div>

    <div class="obs-section">
      <label>Observaciones</label>
      <textarea id="obs" placeholder="Detalles adicionales..." rows="1"></textarea>
    </div>
  </div>

</div>

<datalist id="product-list"></datalist>

<script>
  // 1. REGISTRO PWA (SERVICE WORKER)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(registration => {
          console.log('ServiceWorker registrado con éxito. Modo Offline activado.');
        })
        .catch(error => {
          console.log('Fallo de registro de ServiceWorker: ', error);
        });
    });
  }

  // =================================================================
  // 2. URL ÚNICA DE TU APPS SCRIPT
  // (Asegúrate de que esta URL sea la correcta y esté publicada como "Cualquier persona")
  // =================================================================
  <script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkE_MCH0Gwjl-kyXQ8AjaeNH28sFHN40iaSmsIakoKL8Wyz4GNJruY_wKUJjqBKryvHQ/exec";

/* ============================
   CARGAR LISTA DE PRODUCTOS
   ============================ */
async function fetchProducts() {
    try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        if (data.estado !== "éxito") {
            alert("Error al cargar productos: " + data.mensaje);
            return;
        }

        const lista = document.getElementById("listaProductos");
        lista.innerHTML = "";

        data.productos.forEach((p) => {
            const option = document.createElement("option");
            option.value = p.descripcion;
            option.setAttribute("data-precio", p.precio);
            lista.appendChild(option);
        });

    } catch (err) {
        alert("No se pudieron cargar los productos.");
        console.error(err);
    }
}

/* ============================
   AGREGAR FILA A LA TABLA
   ============================ */
function agregarFilaItem() {
    const tbody = document.querySelector("#tablaItems tbody");
    const fila = document.createElement("tr");

    fila.innerHTML = `
        <td><input type="text" class="item-descripcion" list="listaProductos" onchange="setPrecioAutomatico(this)"></td>
        <td><input type="number" class="item-cantidad" value="1" min="1" onchange="actualizarTotales()"></td>
        <td><input type="number" class="item-precio" value="0" min="0" onchange="actualizarTotales()"></td>
        <td class="item-total">0</td>
        <td><button onclick="eliminarFila(this)">❌</button></td>
    `;

    tbody.appendChild(fila);
}

/* ============================
   AUTOCARGAR PRECIO DESDE LISTA
   ============================ */
function setPrecioAutomatico(input) {
    const descripcion = input.value.trim();
    const precio = document.querySelector(`#listaProductos option[value="${descripcion}"]`)?.dataset.precio;

    if (precio) {
        input.closest("tr").querySelector(".item-precio").value = precio;
    }

    actualizarTotales();
}

/* ============================
   ELIMINAR FILA
   ============================ */
function eliminarFila(btn) {
    btn.closest("tr").remove();
    actualizarTotales();
}

/* ============================
   CALCULAR TOTALES
   ============================ */
function actualizarTotales() {
    let neto = 0;

    document.querySelectorAll("#tablaItems tbody tr").forEach((fila) => {
        const cantidad = parseFloat(fila.querySelector(".item-cantidad").value) || 0;
        const precio = parseFloat(fila.querySelector(".item-precio").value) || 0;
        const total = cantidad * precio;

        fila.querySelector(".item-total").textContent = total;
        neto += total;
    });

    const iva = Math.round(neto * 0.19);
    const totalFinal = neto + iva;

    document.getElementById("totalNeto").textContent = neto;
    document.getElementById("totalIVA").textContent = iva;
    document.getElementById("totalFinal").textContent = totalFinal;
}

/* ============================
   GUARDAR COTIZACIÓN
   ============================ */
async function guardarCotizacion() {
    try {
        const nombre = document.getElementById("clienteNombre").value.trim();
        const rut = document.getElementById("clienteRUT").value.trim();

        if (!nombre || !rut) {
            alert("Debe ingresar nombre y RUT.");
            return;
        }

        const items = [];
        document.querySelectorAll("#tablaItems tbody tr").forEach((fila) => {
            const descripcion = fila.querySelector(".item-descripcion").value.trim();
            const cantidad = parseFloat(fila.querySelector(".item-cantidad").value);
            const precio = parseFloat(fila.querySelector(".item-precio").value);
            const total = cantidad * precio;

            if (descripcion !== "") {
                items.push({ descripcion, cantidad, precio, total });
            }
        });

        if (items.length === 0) {
            alert("Debe agregar al menos un ítem.");
            return;
        }

        const data = {
            cliente: { nombre, rut },
            items: items,
            neto: parseInt(document.getElementById("totalNeto").textContent),
            iva: parseInt(document.getElementById("totalIVA").textContent),
            total: parseInt(document.getElementById("totalFinal").textContent),
            condiciones: document.getElementById("condicionesGenerales").value.trim()
        };

        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.estado === "éxito") {
            alert("Cotización guardada. N°: " + result.numeroAsignado);
        } else {
            alert("Error: " + result.mensaje);
        }

    } catch (error) {
        alert("Error inesperado: " + error.message);
        console.error(error);
    }
}

/* ============================
   INICIALIZACIÓN DE LA PÁGINA
   ============================ */
window.onload = function () {
    fetchProducts();
    agregarFilaItem();
    actualizarTotales();
};
</script>


</body>
</html>
